<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tao ma lo hang</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #162033;
      background: #eef3f7;
    }

    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.08;
    }

    .intro {
      margin: 0 0 24px;
      color: #536174;
      line-height: 1.6;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
      gap: 24px;
      align-items: start;
    }

    .panel,
    .result {
      background: #ffffff;
      border: 1px solid #d8e0e8;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(31, 47, 71, 0.08);
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 46px;
      border: 1px solid #c9d3df;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 16px;
      background: #fbfdff;
    }

    select {
      width: 100%;
      min-height: 46px;
      border: 1px solid #c9d3df;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 16px;
      background: #fbfdff;
    }

    input:focus,
    select:focus {
      outline: 3px solid #b7dcff;
      border-color: #2878bd;
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 22px;
      border: 0;
      border-radius: 6px;
      background: #156f5c;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #0f5f4f;
    }

    .result {
      text-align: center;
    }

    .result h2 {
      margin: 0 0 16px;
      font-size: 22px;
    }

    #qrcode {
      display: grid;
      min-height: 282px;
      place-items: center;
      color: #667386;
      line-height: 1.6;
    }

    #qrcode img,
    #qrcode canvas,
    #qrcode svg {
      width: min(100%, 280px);
      height: auto;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      background: #ffffff;
    }

    pre {
      display: none;
      margin: 18px 0 0;
      padding: 14px;
      overflow: auto;
      text-align: left;
      border-radius: 6px;
      background: #f5f7fa;
      color: #253246;
      font-size: 14px;
      line-height: 1.45;
    }

    .show {
      display: block;
    }

    .message {
      display: none;
      margin: 0 0 16px;
      padding: 12px 14px;
      border-radius: 6px;
      background: #fff1d6;
      color: #6f4300;
    }

    .message.show {
      display: block;
    }

    @media (max-width: 760px) {
      main {
        width: min(100% - 24px, 960px);
        padding: 24px 0;
      }

      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Tao ma lo hang</h1>
    <p class="intro">Nhap thong tin lo hang, ma san pham, so luong va nha cung cap de tao QR code hoac Barcode.</p>

    <div class="layout">
      <section class="panel">
        <p class="message" id="message">Vui long nhap day du thong tin.</p>
        <form id="qr-form">
          <label for="code-type">Loai ma can tao</label>
          <select id="code-type" name="code_type" required>
            <option value="qr">QR code</option>
            <option value="barcode">Barcode</option>
          </select>

          <label for="ma-lo-hang">Ma lo hang</label>
          <input id="ma-lo-hang" name="ma_lo_hang" autocomplete="off" required>

          <label for="ma-san-pham">Ma san pham</label>
          <input id="ma-san-pham" name="ma_san_pham" autocomplete="off" required>

          <label for="so-luong">So luong</label>
          <input id="so-luong" name="so_luong" type="number" min="1" required>

          <label for="nha-cung-cap">Nha cung cap</label>
          <input id="nha-cung-cap" name="nha_cung_cap" autocomplete="off" required>

          <button type="submit">Sinh ma</button>
        </form>
      </section>

      <section class="result">
        <h2>Ma duoc tao</h2>
        <div id="qrcode">Ma se hien thi o day sau khi submit form.</div>
        <pre id="payload"></pre>
      </section>
    </div>
  </main>

  <script>
    const form = document.querySelector("#qr-form");
    const qrContainer = document.querySelector("#qrcode");
    const payloadBox = document.querySelector("#payload");
    const message = document.querySelector("#message");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const data = {
        ma_lo_hang: form.ma_lo_hang.value.trim(),
        ma_san_pham: form.ma_san_pham.value.trim(),
        so_luong: form.so_luong.value.trim(),
        nha_cung_cap: form.nha_cung_cap.value.trim()
      };

      if (!data.ma_lo_hang || !data.ma_san_pham || !data.so_luong || !data.nha_cung_cap) {
        message.classList.add("show");
        return;
      }

      message.classList.remove("show");

      const payload = [
        data.ma_lo_hang,
        data.ma_san_pham,
        data.so_luong,
        data.nha_cung_cap
      ].join("-");

      qrContainer.innerHTML = "";
      payloadBox.textContent = payload;
      payloadBox.classList.add("show");

      if (form.code_type.value === "barcode") {
        if (!window.JsBarcode) {
          qrContainer.textContent = "Khong tai duoc thu vien tao Barcode. Hay kiem tra ket noi internet va tai lai trang.";
          return;
        }

        const barcode = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        qrContainer.appendChild(barcode);
        JsBarcode(barcode, payload, {
          format: "CODE128",
          width: 2,
          height: 100,
          displayValue: true,
          margin: 12
        });
        return;
      }

      if (!window.QRCode) {
        qrContainer.textContent = "Khong tai duoc thu vien tao QR. Hay kiem tra ket noi internet va tai lai trang.";
        return;
      }

      new QRCode(qrContainer, {
        text: payload,
        width: 280,
        height: 280,
        correctLevel: QRCode.CorrectLevel.H
      });
    });
  </script>
</body>
</html>
